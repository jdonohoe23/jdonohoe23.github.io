<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jeff Donohoe | GIS Portfolio</title>
  <style>
    :root {
      --navy: #16324f;
      --blue: #2f6fb0;
      --light-blue: #eaf3fb;
      --soft-blue: #f4f8fc;
      --text: #1f2933;
      --muted: #52616b;
      --border: #d8e2ec;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 0;
      color: var(--text);
      background: linear-gradient(180deg, var(--light-blue), #ffffff 30%);
    }

    .wrap {
      max-width: 980px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .panel {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(22, 50, 79, 0.08);
      padding: 36px;
    }

    header {
      text-align: center;
      padding-bottom: 24px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0 0 8px 0;
      color: var(--navy);
      font-size: 2.4rem;
    }

    .tagline {
      color: var(--muted);
      font-size: 1.1rem;
      max-width: 760px;
      margin: 0 auto 16px auto;
    }

    nav {
      margin-top: 18px;
    }

    nav a {
      display: inline-block;
      margin: 6px 8px;
      color: white;
      background: var(--blue);
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 0.95rem;
    }

    nav a:hover {
      background: var(--navy);
    }

    section {
      margin: 28px 0;
    }

    h2 {
      color: var(--navy);
      border-left: 6px solid var(--blue);
      padding-left: 12px;
      margin-bottom: 14px;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 24px;
      align-items: start;
      margin-top: 16px;
    }

    .about-photo {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 16px;
      border: 1px solid var(--border);
      display: block;
    }

    .caption {
      font-style: italic;
      color: var(--muted);
      margin: 10px 0 0 0;
    }

    .card {
      background: var(--soft-blue);
      border: 1px solid var(--border);
      padding: 18px;
      margin: 16px 0;
      border-radius: 12px;
    }

    .card h3 {
      margin-top: 0;
      color: var(--blue);
    }

    ul {
      padding-left: 22px;
    }
